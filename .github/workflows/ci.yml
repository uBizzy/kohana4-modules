# Checks every push and pull request, on each supported PHP version. The
# modules are checked where they live in a project: copied into the
# modules/ directory of Kohana 4, with every check of the framework
# (code style, types, class loading, the tests) and static analysis.
#
# Tests that need a database, FTP or S3 server are skipped here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Check out the framework
        uses: actions/checkout@v4
        with:
          repository: uBizzy/kohana4

      - name: Check out this repository beside it
        uses: actions/checkout@v4
        with:
          path: kohana4-modules

      - name: Copy the modules into modules/
        run: cp -r kohana4-modules/ub_* modules/

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, exif, imagick, mysqli, pdo_mysql, pdo_pgsql, pdo_sqlite, sodium, redis, apcu, memcached, zip, ftp
          ini-values: apc.enable_cli=1, error_reporting=E_ALL
          coverage: none

      - name: Install the en_US locale used by the tests
        run: |
          sudo locale-gen en_US.UTF-8
          sudo update-locale

      - name: Install Composer packages
        run: composer install --no-interaction --no-progress

      # The checks of the framework find the modules in modules/
      - name: Checks and tests of the framework, with the modules
        run: docker/check.sh

      - name: Static analysis of the modules
        run: vendor/bin/phpstan analyse -c kohana4-modules/phpstan.neon --no-progress --memory-limit=1G
